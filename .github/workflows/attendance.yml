name: Daily Attendance Check

on:
  schedule:
    # Runs at 7:52 AM IST (2:22 AM UTC) - off-peak minute avoids GitHub cron delays
    - cron: '22 2 * * *'
    # Backup run at 8:22 AM IST (2:52 AM UTC) in case GitHub queues the earlier run
    - cron: '52 2 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab anytime!

jobs:
  check-attendance:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Attendance Check & Send Telegram Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INTERNMO_USER: ${{ secrets.INTERNMO_USER }}
          INTERNMO_PASSWORD: ${{ secrets.INTERNMO_PASSWORD }}
          TIMEZONE: "Asia/Kolkata"
        run: |
          python check_attendance.py
